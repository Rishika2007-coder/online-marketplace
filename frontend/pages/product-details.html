<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Details | ShopSphere</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/style.css"></head><body><header class="nav"><a class="brand" href="../index.html">Shop<span>Sphere</span></a><nav class="navlinks"><a href="../index.html">Home</a><a href="products.html">Shop</a><a href="cart.html">Cart</a><a href="login.html">Login</a><a href="register.html">Register</a><button onclick="logout()">Logout</button></nav></header><main class="container"><div id="productDetail" class="card">Open a product from the shop to view details. Product ID is in the page URL.</div><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return;try{const p=await api('/products/'+id);document.getElementById('productDetail').innerHTML=`<img style="max-width:420px;width:100%" src="${p.image||'https://placehold.co/600x400'}"><h1>${p.product_name}</h1><p>${p.description||''}</p><h2>₹${p.price}</h2><p>Stock: ${p.stock_quantity}</p><button onclick="addToCart(${p.product_id})">Add to cart</button>`;}catch(e){document.getElementById('productDetail').textContent=e.message;}});</script></main><footer>© 2026 ShopSphere · Your marketplace, simplified.</footer><script src="../js/api.js"></script><script src="../js/products.js"></script></body></html>
